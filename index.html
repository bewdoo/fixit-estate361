<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fixit · Estate 361</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#FFFFFF;--ink:#18181B;--muted:#5F6368;--faint:#9A9AA0;--line:#ECEAE4;--line2:#E3E1DA;
  --forest:#163A28;--gold:#9A6B12;--em:#0F8A64;--em-soft:#E4F2EC;--em-mid:#7FC3A6;
  --brn:#B8730A;--brn-soft:#F7ECDA;--brn-mid:#DDB46A;--sand:#F8F6F0;--stone:#CDC9BF;--track:#ECE9E1;
  --red:#D64545;--red-soft:#FBE5E5;--grey:#A8A49B;--blue:#2563EB;--blue-soft:#EBF1FE;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em;flex:none}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.proj{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.upbtn{appearance:none;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;flex:none}
.upbtn:hover{background:var(--sand)}
.tabbar{border-top:1px solid var(--line)}
.tabs{max-width:1240px;margin:0 auto;padding:6px 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab i{font:normal 600 10.5px var(--mono);color:var(--faint)}
.tab:hover{background:var(--sand);color:var(--ink)}
.tab.on{background:var(--forest);color:#fff}
.tab.on i{color:#E9D8B4}

.app{max-width:1340px;margin:0 auto;padding-inline:16px;padding-block:22px 60px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:26px;align-items:start}
.app.noside{grid-template-columns:minmax(0,1fr);max-width:1180px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 90px);overflow:auto;scrollbar-width:thin}
.pcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.pcard .pc-top{background:linear-gradient(160deg,#1B3A2B,#0F2A1E);color:#F4E7CB;padding:14px}
.pcard .pc-top small{display:block;font:600 9px var(--mono);letter-spacing:.18em;opacity:.7}
.pcard .pc-top b{display:block;font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.15;margin-top:6px}
.pcard .pc-top span{font-size:11.5px;opacity:.75}
.pcard .pc-score{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pcard .pc-score b{font-size:12.5px}
.pcard .pc-score span{display:block;font-size:11px;color:var(--muted)}
.pcard dl{margin:0;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:11.5px}
.pcard dt{color:var(--muted)}
.pcard dd{margin:0;text-align:right;font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .ng{font:700 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:12px 10px 5px}
.nav button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:9px;text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:7px 10px;border-radius:8px;cursor:pointer}
.nav button i{font:normal 600 10px var(--mono);color:var(--faint);min-width:16px}
.nav button:hover{background:var(--sand);color:var(--ink)}
.nav button.on{background:var(--forest);color:#fff;font-weight:600}
.nav button.on i{color:#E9D8B4}
.nav button.star{font-weight:700;color:var(--forest)}
.nav button.star.on{color:#fff}
@media(max-width:1000px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;overflow:visible}.pcard{display:none}.nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none}.nav .ng{display:none}.nav button{white-space:nowrap}}
.view{animation:fade .25s ease}
@keyframes fade{from{transform:translateY(4px)}to{transform:none}}

/* page header like the deck */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.eyebrow{font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ph h1{font-family:var(--serif);font-weight:600;font-size:clamp(22px,2.4vw,30px);line-height:1.08;color:var(--forest);margin-top:6px;letter-spacing:-.005em}
.ph .pn{font:600 12px var(--mono);color:var(--faint);letter-spacing:.08em}
.pfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;font-size:12px;color:var(--faint)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pgbtn{appearance:none;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.pgbtn span{font:600 10.5px var(--mono);color:var(--faint);letter-spacing:.06em}
.pgbtn:hover{border-color:var(--forest)}
.pgbtn.next{align-items:flex-end;margin-left:auto}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:0 1px 2px rgba(22,58,40,.04)}
.ct{display:flex;align-items:center;gap:8px;font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--forest);margin-bottom:14px}
.ct svg{width:18px;height:18px;flex:none}
.g{display:grid;gap:14px}
.ic{width:20px;height:20px;flex:none}

/* stat tiles */
.stat{display:flex;flex-direction:column;gap:8px}
.stat .si{color:var(--forest)}.stat .si svg{width:20px;height:20px}
.stat .sv{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat .sv small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.stat .sl{font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* score bars */
.sbars{display:flex;flex-direction:column;gap:10px}
.sbar{display:grid;grid-template-columns:140px 1fr 30px;gap:10px;align-items:center;font-size:12.5px}
.sbar .tr{height:9px;background:var(--track);border-radius:5px;overflow:hidden}
.sbar .fl{height:100%;border-radius:5px}
.sbar b{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* phase strip */
.phase{display:flex;gap:4px;align-items:stretch;position:relative}
.phase>div:not(.mk){border-radius:7px;background:var(--track);color:var(--muted);font-size:11.5px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:8px 4px;white-space:nowrap;overflow:hidden}
.phase>div.now{background:var(--forest);color:#fff;font-weight:600}
.phase .mk{position:absolute;top:-26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.phase .mk b{font-size:12.5px;color:var(--gold);white-space:nowrap}
.phase .mk span{width:2px;height:44px;background:var(--gold)}
.phase .mk span::before{content:"";display:block;width:12px;height:12px;border-radius:50%;background:var(--gold);margin:-6px 0 0 -5px}
.paxis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}

/* payment plan */
.pay{display:flex;gap:3px;position:relative}
.pay div{height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.payl{display:flex;gap:3px;margin-top:6px;font-size:12px;color:var(--muted);text-align:center}
.payl div{flex-shrink:0}

/* apartments */
.apt{border-top:5px solid var(--em);display:flex;flex-direction:column;gap:18px}
.apt.b{border-top-color:var(--brn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--em-soft);color:var(--em)}
.apt.b .pill{background:var(--brn-soft);color:var(--brn)}
.towers{font:700 10.5px var(--sans);letter-spacing:.1em;color:var(--muted)}
.bracket{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin-bottom:6px}
.bracket::before,.bracket::after{content:"";flex:1;height:1px;background:var(--ink);opacity:.7}
.stack{display:flex;gap:3px}
.stack div{height:42px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;min-width:0;overflow:hidden}
.stackl{display:flex;gap:3px;margin-top:6px;font-size:12px;color:var(--muted)}
.stackl div{text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
.rings{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big2{display:flex;flex-direction:column;gap:10px}
.big2 b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.big2 span{font:700 10px var(--sans);letter-spacing:.1em;color:var(--muted)}

/* pricing */
.bsp{background:var(--forest);color:#fff;border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.bsp .k{display:flex;align-items:center;gap:10px;font:700 11px var(--sans);letter-spacing:.14em;color:#E9D8B4}
.bsp .v{font-size:clamp(36px,3.6vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1}
.bsp .v small{white-space:nowrap;font-size:15px;font-weight:500;letter-spacing:0;opacity:.85}
.bsp .row{background:#fff;color:var(--ink);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;border-left:5px solid var(--em)}
.bsp .row.b{border-left-color:var(--brn)}
.bsp .row b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.bsp .note{font-size:12.5px;opacity:.75}
.bench{position:relative}
.bgrp{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.bgrp:first-child{margin-top:0}
.brow{display:grid;grid-template-columns:var(--lab) 1fr;gap:12px;align-items:center;margin:5px 0;font-size:12.5px}
.brow .bl{text-align:right;color:var(--muted)}
.brow .bt{position:relative;height:24px}
.brow .bf{position:absolute;inset:0 auto 0 0;background:var(--stone);border-radius:4px}
.brow .bv{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:12px;padding-left:8px;font-variant-numeric:tabular-nums}
.brow.avg .bl{font-weight:700;color:var(--ink)}
.brow.avg .bt{height:20px}
.brow.avg .dl{position:absolute;left:0;top:50%;border-top:2px dotted var(--ink)}
.brow .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pricegrid{grid-template-columns:minmax(280px,.75fr) minmax(0,1.9fr)}
@media(max-width:960px){.pricegrid{grid-template-columns:1fr}}
.vline{position:absolute;top:0;bottom:22px;width:0;border-left:2px solid var(--em);pointer-events:none}
.vline.d{border-left:2px dashed var(--em-mid)}
.vlab{position:absolute;bottom:0;font-size:12px;font-weight:700;color:var(--em);white-space:nowrap}

/* usp */
.usp{display:flex;flex-direction:column;gap:16px}
.usph{display:flex;gap:14px;align-items:flex-start}
.tile{width:40px;height:40px;border-radius:10px;background:var(--forest);color:#fff;display:grid;place-items:center;flex:none}
.tile.s{width:40px;height:40px;background:var(--em-soft);color:var(--em)}
.tile.sb{background:var(--brn-soft);color:var(--brn)}
.tile.r{background:var(--red-soft);color:var(--red)}
.tile.sm{width:40px;height:40px;border-radius:10px}
.usph h3{font-size:14px;font-weight:700;line-height:1.3}
.str{display:flex;align-items:center;gap:5px;margin-top:5px;font:700 10px var(--sans);letter-spacing:.08em}
.str i{width:22px;height:6px;border-radius:3px;background:var(--track)}
.quote{background:var(--sand);border-radius:10px;padding:18px 18px 18px 44px;position:relative;font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--forest);flex:1;display:flex;align-items:center}
.quote::before{content:"\201D";position:absolute;left:16px;top:50%;transform:translateY(-38%);font-size:34px;color:var(--brn-mid);font-family:var(--serif)}

/* location */
.map svg{display:block;width:100%;height:auto}
.map text{font-family:var(--sans)}
.alert{display:flex;gap:10px;align-items:center;background:var(--red-soft);color:#A12C2C;border-radius:9px;padding:9px 12px;font-weight:600;font-size:12.5px}

/* buyer types */
.mrow{display:grid;grid-template-columns:84px 200px 1fr;gap:18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mx{font-size:24px;font-weight:800;letter-spacing:-.03em}
.mrow .mb{display:flex;flex-direction:column;gap:8px}
.mrow .mb .tr{height:26px;border-radius:8px;background:var(--track);overflow:hidden;display:flex;align-items:center}
.mrow .mb .tr div{height:100%;border-radius:8px}
.mrow .mb span{font:700 10px var(--sans);letter-spacing:.1em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--em);border-radius:999px;padding:5px 11px;font-weight:600;font-size:12.5px;color:var(--ink);background:#fff}
.chip svg{width:14px;height:14px;color:var(--em)}
.chip.x{border-color:var(--red);background:var(--red-soft)}
.chip.x svg{color:var(--red)}
.chip.m{border-color:var(--em-mid)}
.chip.f{border-color:var(--line2)}
.chip.f svg{color:var(--muted)}

/* strengths/weaknesses */
.colhead{display:flex;align-items:center;gap:9px;color:#fff;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:10px;background:var(--em)}
.colhead.b{background:var(--brn)}
.srow{display:grid;grid-template-columns:40px 1fr 14px minmax(0,.9fr);gap:12px;align-items:center;padding:13px 14px}
.srow h3{font-size:13.5px;font-weight:700}
.srow .sub{font-size:12px;color:var(--muted);margin-top:1px}
.rate{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:700;font-size:12px}
.rate .tr{width:110px;height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.rate .tr div{height:100%;border-radius:4px}
.who{background:var(--sand);border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
.who svg{color:var(--em)}
.b .who svg{color:var(--brn)}
.chev{color:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--sand);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);font-weight:500}
.tag svg{width:12px;height:12px}
.handle{background:var(--sand);border-radius:9px;padding:10px 12px;border-left:3px solid var(--em);display:flex;gap:8px;font-weight:500;font-size:12.5px;line-height:1.45}
.handle svg{color:var(--em);flex:none;margin-top:1px}
.b .handle{border-left-color:var(--brn)}
.b .handle svg{color:var(--brn)}

/* home is for */
.fortbl{display:grid;grid-template-columns:120px 1fr 1fr 1fr 1fr;gap:10px;align-items:stretch}
.fortbl .rl{display:flex;flex-direction:column;justify-content:center;gap:6px;font-weight:700;font-size:12.5px}
.cell{border-radius:10px;padding:11px 13px;display:flex;gap:9px;align-items:center;font-weight:600;font-size:12.5px;line-height:1.4}
.cell.y{background:#E5F3EC;color:#145A3E}
.cell.n{background:var(--red-soft);color:#8E2626}
.cell .ok,.cell .no{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-size:12px;font-weight:800}
.cell .ok{background:#1F9D55}.cell .no{background:var(--red)}
.sig{display:flex;flex-direction:column;gap:12px}
.sig .tile{width:32px;height:32px;border-radius:8px}
.sig .lab{font:700 10px var(--sans);letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.sig q{font-family:var(--serif);font-size:15px;line-height:1.38;color:var(--forest);quotes:"\201C" "\201D"}

/* where buyers live */
.reg{padding:0;overflow:hidden}
.reg .rh{background:var(--forest);color:#fff;display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;padding:12px 16px}
.reg .ri{padding:15px 18px;border-top:1px solid var(--line)}
.reg .ri:first-of-type{border-top:0}
.reg h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reg .sub{font-size:13px;color:var(--muted);margin-top:2px}
.flag{font:800 10.5px var(--sans);letter-spacing:.08em;background:var(--brn-soft);color:var(--gold);padding:3px 8px;border-radius:6px}
.slider{position:relative;height:6px;background:var(--track);border-radius:3px;margin:16px 14px 4px 0}
.slider div{position:absolute;inset:0 auto 0 0;background:var(--forest);border-radius:4px}
.slider b{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:12px;border:3px solid #fff}
.slider .cap{position:absolute;top:-10px;bottom:-10px;border-left:2px dotted var(--red)}

/* upload */
.upgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.uph{margin-bottom:22px}
.uph h1{font-family:var(--serif);font-weight:600;font-size:clamp(24px,3vw,32px);color:var(--forest);line-height:1.1}
.uph p{margin-top:8px;color:var(--muted);font-size:14px;max-width:620px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:44px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--em);background:var(--em-soft)}
.drop .dico{width:50px;height:50px;border-radius:14px;background:var(--sand);display:grid;place-items:center;color:var(--forest)}
.drop h3{font-size:18px;font-weight:700}
.drop p{font-size:14px;color:var(--muted);max-width:40ch}
.btn{appearance:none;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.dark{background:var(--forest);color:#fff;border-color:var(--forest)}
.cover{border-radius:10px;background:linear-gradient(160deg,#1B2A41,#0E1726);color:#E9D8B4;padding:14px;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:3/4;max-width:100%}
.cover .c1{font:600 8.5px var(--mono);letter-spacing:.2em;opacity:.7}
.cover .c2{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.04em;line-height:1.2;color:#F4E7CB}
.cover .c3{font-size:9px;letter-spacing:.08em;opacity:.8}
.samplecard{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;transition:.15s;width:100%}
.samplecard:hover{border-color:var(--em);box-shadow:0 2px 10px rgba(15,138,100,.1)}
.steps{display:flex;flex-direction:column}
.stp{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:center}
.stp:first-child{border-top:0}
.stp .n{width:24px;height:24px;border-radius:50%;background:var(--track);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:11px}
.stp .t{font-size:14.5px;font-weight:500;color:var(--faint)}
.stp.active .n{background:var(--em);color:#fff;animation:pulse 1s ease infinite}
.stp.active .t,.stp.done .t{color:var(--ink)}
.stp.done .n{background:var(--forest);color:#fff}
@keyframes pulse{50%{opacity:.5}}
.prog{height:5px;background:var(--track);border-radius:3px;overflow:hidden;margin:14px 0 8px}
.prog div{height:100%;background:var(--em);width:0;transition:width .4s ease}
.filecard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--sand)}
.filecard .fi{width:36px;height:44px;border-radius:6px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font:700 9.5px var(--mono);flex:none}
.small{font-size:13px;color:var(--muted)}
.label{font:700 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}


/* advisor brief */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;background:linear-gradient(135deg,#163A28 0%,#1F4A35 100%);color:#fff;border-radius:14px;padding:22px 24px}
.verdict .vtag{display:inline-flex;align-items:center;gap:7px;background:rgba(233,216,180,.16);color:#E9D8B4;font:700 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.verdict h2{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.25;margin-top:10px;max-width:60ch}
.verdict p{font-size:13px;line-height:1.6;opacity:.82;margin-top:8px;max-width:78ch}
.vscores{display:grid;grid-template-columns:repeat(2,auto);gap:4px 14px;background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px}
.vscores div{display:flex;flex-direction:column;align-items:center;font-size:10.5px;opacity:.9;text-align:center}
.kstrip{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.kstrip>div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.kstrip>div:first-child{border-left:0}
.kstrip .kl{font:700 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kstrip .kv{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kstrip .ks{font-size:11px;color:var(--muted);margin-top:1px}
.scale{position:relative;height:96px;margin:6px 8px 0}
.scale .axis{position:absolute;left:0;right:0;top:46px;height:8px;border-radius:4px;background:linear-gradient(90deg,#E8E5DD,#D9D4C7)}
.scale .m{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;width:120px}
.scale .m b{font-size:12.5px;font-variant-numeric:tabular-nums}
.scale .m span{font-size:10.5px;color:var(--muted);line-height:1.25}
.scale .m i{width:14px;height:14px;border-radius:50%;border:3px solid #fff;margin-top:6px;box-shadow:0 0 0 1px var(--line2)}
.scale .m.dn{top:40px;flex-direction:column-reverse}
.scale .m.dn i{margin:0 0 6px}
.scale .m.you b{color:var(--em);font-size:14px}
.rec{display:flex;flex-direction:column;gap:9px}
.rec li{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:start;font-size:12.5px;line-height:1.45}
.rec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rec .mk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.rec b{font-weight:700}
.rec .why{color:var(--muted)}
.mult{font:700 11px var(--mono);color:var(--em)}
.tp{display:flex;flex-direction:column;gap:10px;counter-reset:tp}
.tp li{list-style:none;display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:12.5px;line-height:1.5}
.tp li::before{counter-increment:tp;content:counter(tp);width:22px;height:22px;border-radius:6px;background:var(--forest);color:#E9D8B4;font:700 11px var(--mono);display:grid;place-items:center}
.tp ul{margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.obj{display:flex;flex-direction:column;gap:0}
.obj>div{padding:10px 0;border-top:1px solid var(--line)}
.obj>div:first-child{border-top:0;padding-top:0}
.obj .q{font-size:12.5px;font-weight:700;color:var(--ink)}
.obj .a{font-size:12.5px;color:var(--muted);margin-top:3px;padding-left:12px;border-left:2px solid var(--em-mid)}
.chk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk li{display:flex;gap:9px;align-items:flex-start;background:var(--sand);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.chk li input{margin-top:2px;accent-color:var(--em);width:14px;height:14px;flex:none}
.chk li b{display:block;font-weight:700}
.chk li span{color:var(--muted)}
@media(max-width:1100px){.kstrip{grid-template-columns:repeat(3,1fr)}.kstrip>div:nth-child(4){border-left:0}.kstrip>div:nth-child(n+4){border-top:1px solid var(--line)}}
@media(max-width:760px){.verdict{grid-template-columns:1fr}.chk{grid-template-columns:1fr}.kstrip{grid-template-columns:1fr 1fr}.kstrip>div{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)}.kstrip>div:nth-child(odd){border-left:0!important}.kstrip>div:nth-child(-n+2){border-top:0}}

.samplecard{grid-template-columns:80px 1fr;gap:12px}
.samplecard .cover{padding:9px}
.samplecard .cover .c1{font-size:6.5px;letter-spacing:.12em}
.samplecard .cover .c2{font-size:11.5px}
.samplecard .cover .c3{font-size:7px}
/* project switcher */
.pswitch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sand);border-radius:12px;padding:4px}
.pswitch button{appearance:none;border:0;background:none;border-radius:9px;padding:7px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.pswitch b{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pswitch span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pswitch button.on{background:#fff;box-shadow:0 1px 3px rgba(22,58,40,.12)}
.pswitch button.on b{color:var(--forest)}
.lede{font-family:var(--serif);font-size:clamp(16px,1.6vw,20px);line-height:1.4;color:var(--forest);margin:-4px 0 18px;max-width:90ch}
.stat .sn{font-size:11.5px;color:var(--muted);margin-top:-4px}
.stat .sn.w{color:var(--gold)}
.ctag{font:800 9.5px var(--sans);letter-spacing:.1em;color:var(--em);background:var(--em-soft);padding:4px 9px;border-radius:999px;text-transform:uppercase}
.bnote{background:var(--sand);border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.55;margin-top:14px}
/* family fit */
.ffhead{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;align-items:stretch}
.ffcard{border-top:4px solid var(--em);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ffcard.b{border-top-color:var(--brn)}
.ffcard .pr{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.ffcard .pr small{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.ffcard h3{font-size:13.5px;font-weight:700}
.ffcard p{font-size:11.5px;color:var(--muted);margin-top:3px}
.ffcard .dv{border-left:1px solid var(--line);padding-left:16px}
.ffgrid{display:grid;grid-template-columns:150px repeat(4,1fr);gap:0 14px;margin-top:8px}
.ffgrid .h{font-size:10.5px;font-weight:700;color:var(--muted);padding:2px 0 6px}
.ffgrid .rl{display:flex;align-items:center;gap:9px;font-weight:700;font-size:12.5px;padding:12px 0}
.ffgrid .c{display:flex;gap:7px;font-size:12px;line-height:1.45;padding:12px 0}
.ffgrid .c.y{color:#1E3A2C}.ffgrid .c.n{color:#9A2B2B}
.ffgrid .c.y::before{content:"✓";color:#1F9D55;font-weight:800}
.ffgrid .c.n::before{content:"✕";color:var(--red);font-weight:800}
.ffgrid .row{display:contents}
.ffgrid .stripe{grid-column:1/-1;height:1px;background:var(--line)}
.firstcall{display:grid;grid-template-columns:150px repeat(4,1fr);gap:12px;align-items:center;background:var(--forest);border-radius:14px;padding:14px 16px;margin-top:16px}
.firstcall .t{color:#E9D8B4;font-weight:700;font-size:14px;line-height:1.3}
.firstcall .q{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;color:#fff;font-weight:600;font-size:12.5px;line-height:1.35}
.firstcall .q b{width:24px;height:24px;border-radius:50%;background:#E9D8B4;color:var(--forest);display:grid;place-items:center;flex:none;font-size:12px}
/* price chart */
.pchart svg{display:block;width:100%;height:auto}
.pchart text{font-family:var(--sans)}
.dark{background:var(--forest);color:#fff;border-radius:14px;padding:18px}
.dark h3{color:#E9D8B4;font-size:13.5px;font-weight:700}
.dark p{font-size:12.5px;line-height:1.55;opacity:.9;margin-top:6px}
.gold{color:var(--gold);font-size:13.5px;font-weight:700}
/* who works / not counted */
.nc{background:#F4F2EC;border-color:#E6E2D8}
.nc .it{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 0;color:var(--muted)}
.nc .it b{display:block;color:#3F3F46;font-size:13px}
.nc .it span{font-size:12px}
/* where they live */
.wl{display:grid;grid-template-columns:28px minmax(170px,1.2fr) 110px minmax(240px,2fr) minmax(150px,1fr);gap:12px;align-items:center;padding:9px 12px;border-radius:10px}
.wl:nth-child(odd){background:#fff}
.wl .nb{width:26px;height:26px;border-radius:50%;background:var(--em);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.wl b{font-size:13px;font-weight:700;display:block}
.wl small{font-size:11.5px;color:var(--muted)}
.wl .tk{position:relative;height:26px}
.wl .tk .bar{position:absolute;top:50%;height:11px;transform:translateY(-50%);border-radius:6px;background:#3FA37E}
.wl .tk .sl{position:absolute;top:-10px;bottom:-10px;width:2px;background:var(--forest)}
.wl .tk .gl{position:absolute;top:-10px;bottom:-10px;width:1px;background:var(--line)}
.wl.dim{color:var(--faint)}
.wl.dim b{color:#8A8A90;font-weight:500}
.wl.dim .tk .bar{background:#DDDAD2}
.wl .why{font-size:12.5px}
/* second wave */
.mgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.mgrid span{background:var(--sand);border-radius:7px;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 0}
.evt{position:absolute;display:flex;flex-direction:column;gap:6px}
.evt b{align-self:flex-start;background:var(--forest);color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:9px}
.evt b.m{background:#4F7D63}
.evt span{font-size:11.5px;color:var(--muted);line-height:1.4}
@media(max-width:1100px){.wl{grid-template-columns:28px 1fr 100px;}.wl .tk{grid-column:2/-1}.wl .why{grid-column:2/-1}}
@media(max-width:960px){.ffhead,.ffgrid,.firstcall{grid-template-columns:1fr}.ffhead>.sp,.ffgrid .h.sp{display:none}.ffgrid{grid-template-columns:1fr 1fr}.ffgrid .rl{grid-column:1/-1;padding-bottom:0}.ffgrid .h{display:none}}
/* responsive */
.c4{grid-template-columns:repeat(4,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.c2{grid-template-columns:1fr 1fr}
.c5{grid-template-columns:repeat(5,1fr)}
.main-side{grid-template-columns:minmax(0,1.85fr) minmax(300px,1fr)}
.side-main{grid-template-columns:minmax(300px,.8fr) minmax(0,1.6fr)}
@media(max-width:1100px){.c5{grid-template-columns:repeat(3,1fr)}.srow{grid-template-columns:44px 1fr;}.srow .chev{display:none}.srow .who,.srow .handle{grid-column:1/-1}}
@media(max-width:960px){.main-side,.side-main{grid-template-columns:1fr}.c4{grid-template-columns:1fr 1fr}.fortbl{grid-template-columns:1fr 1fr}.fortbl .rl{grid-column:1/-1;flex-direction:row;align-items:center}.fortbl .hd{display:none}.mrow{grid-template-columns:90px 1fr}.mrow .chips{grid-column:1/-1}}
@media(max-width:760px){.c3,.c2,.upgrid{grid-template-columns:1fr}.c5{grid-template-columns:1fr 1fr}.sbar{grid-template-columns:110px 1fr 32px}.brow{--lab:120px!important}}
@media(max-width:480px){.c4,.c5,.fortbl{grid-template-columns:1fr}.stat .sv{font-size:28px}.mrow{grid-template-columns:1fr}.ph .pn{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* estate 361 */
.audtabs{display:inline-flex;gap:3px;background:var(--sand);border:1px solid var(--line);border-radius:12px;padding:3px}
.audtabs button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.audtabs button:hover{color:var(--ink)}
.audtabs button.on{background:var(--forest);color:#fff;box-shadow:0 1px 3px rgba(22,58,40,.25)}
.proj{display:flex;justify-content:center}
.samplebig{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;border-color:var(--em-mid);background:linear-gradient(180deg,#FBFDFC,#fff)}
.samplebig .cover{padding:12px}
.samplebig .cover .c2{font-size:15px}
.analyse{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:14.5px;padding:12px 18px;align-self:flex-start;min-width:180px}
.analyse:disabled{opacity:.7;cursor:progress}
@media(max-width:820px){.topbar-in{flex-wrap:wrap}.proj{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto}}
@media(max-width:480px){.samplebig{grid-template-columns:1fr}.samplebig .cover{max-width:140px}}

  const r=size*.38,c=size/2,C=2*Math.PI*r,len=C*.75,f=len*v/max;
  return `<svg width="${size}" height="${size*.86}" viewBox="0 0 ${size} ${size*.86}" role="img" aria-label="${v} ${label}">
  <g transform="rotate(135 ${c} ${c})"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${trk}" stroke-width="${size*.075}" stroke-dasharray="${len} ${C}" stroke-linecap="round"/>
  <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${size*.075}" stroke-dasharray="${f} ${C}" stroke-linecap="round"/></g>
  <text x="${c}" y="${c+size*.07}" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="${size*.22}" fill="${tc}">${v}</text>
  ${label?`<text x="${c}" y="${c+size*.19}" text-anchor="middle" font-family="Inter, sans-serif" font-size="${size*.075}" fill="var(--muted)">${label}</text>`:""}</svg>`;
}
function ringPct(p,color,label,sub,size=124){

}

          <div class="filecard" style="margin-top:6px"><span class="fi">PDF</span><div style="min-width:0"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${SAMPLE.name}</div><div class="small" style="font-size:11.5px">${(SAMPLE.size/1e6).toFixed(1)} MB · ready to analyse</div></div></div>

        </div>
      </div>
    </div>
    <div class="card">
      <div id="fileSlot"><div class="label">What happens next</div></div>
      <div class="prog"><div id="prog"></div></div>
      <div class="steps">${STEPS.map((p,i)=>`<div class="stp" id="ps${i}"><span class="n">${i+1}</span><span class="t">${p}</span></div>`).join("")}</div>

    </div>
  </div></div>`;

let timer=null;
function bindUpload(){
  const drop=$("#drop"),file=$("#file");
  file.onchange=()=>{if(file.files[0])run(file.files[0])};
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0];if(f)run(f)});
  $("#sampleBtn").onclick=ev=>{ev.preventDefault();run(SAMPLE)};
}
function run(f){
  srcName=f.name.replace(/[<>&]/g,"");P=AUD.general;
  const ext=(f.name.split(".").pop()||"doc").toUpperCase().slice(0,4);
  $("#fileSlot").innerHTML=`<div class="filecard"><span class="fi">${ext}</span><div style="min-width:0"><div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${srcName}</div><div class="small">${f.size?(f.size/1e6).toFixed(1)+" MB · ":""}analysing…</div></div></div>`;
  document.querySelectorAll(".analyse").forEach(b=>{b.disabled=true;b.innerHTML="Analysing…"});
  clearTimeout(timer);let i=0;
  const step=()=>{
    $("#prog").style.width=(i/STEPS.length*100)+"%";
    if(i>0){const d=$("#ps"+(i-1));d.classList.remove("active");d.classList.add("done");d.querySelector(".n").textContent="✓"}
    if(i>=STEPS.length){timer=setTimeout(()=>go(P.pages[0][0]),450);return}
    $("#ps"+i).classList.add("active");i++;timer=setTimeout(step,1200);
  };
  step();
}

function dotPlot(attrs,n1,n2){
  const W=760,H=220,L=30,R=10,T=14,B=40,cw=(W-L-R)/attrs.length,Y=v=>T+(H-T-B)*(1-v/5);
  let g="";[0,1,2,3,4,5].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>`);
  g+=`<text x="${L-10}" y="${Y(5)+4}" text-anchor="end" font-size="11" fill="var(--muted)">5</text><text x="${L-10}" y="${Y(0)+4}" text-anchor="end" font-size="11" fill="var(--muted)">0</text>`;
  attrs.forEach((a,i)=>{const cx=L+cw*i+cw/2,same=a[1]===a[2];
    if(!same)g+=`<line x1="${cx}" x2="${cx}" y1="${Y(a[1])}" y2="${Y(a[2])}" stroke="#C9C6BE" stroke-width="2"/>`;
    g+=`<circle cx="${same?cx-9:cx}" cy="${Y(a[1])}" r="8" fill="var(--em)" stroke="#fff" stroke-width="2"><title>${a[0]} · ${n1} ${a[1]}</title></circle>`;

    g+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="12.5" fill="var(--ink)">${a[0]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;min-width:560px" role="img" aria-label="Unit ratings, ${n1} vs ${n2}">${g}</svg>`;
